# MerlinCCU integration (docs/home-assistant-setup.md, steps 5 and 6).
# Add this block to Home Assistant's configuration.yaml, then restart HA.
# Every part is optional; keep the ones you use.
merlinccu:
  # Share feed (step 5).
  # The CCU's "Feed token" setting. Put the value in secrets.yaml as
  # merlinccu_feed_token. Remove this line to serve the feed without a token.
  feed_token: !secret merlinccu_feed_token
  # Up to six shares, matching the CCU's watched-share symbols exactly.
  # Symbols are Yahoo Finance symbols: LSE shares end in .L.
  shares:
    - symbol: BA.L
      # Optional. Left out, the CCU keeps the display name set on the CCU.
      name: BAE SYSTEMS

  # House weather over MQTT (step 6). Needs the MQTT integration.
  weather:
    # Any weather entity with hourly and daily forecasts.
    entity: weather.forecast_home
    # Optional; these are the defaults.
    sun: sun.sun
    base_topic: merlinccu

  # Met Office and flood warnings over MQTT (step 6). Needs the MQTT
  # integration. Give a region, a flood point, or both.
  warnings:
    # Met Office warning region code, e.g. sw (South West England).
    met_office_region: sw
    # Environment Agency flood warnings (England) within this distance.
    flood_latitude: 50.62
    flood_longitude: -2.45
    # Optional; these are the defaults.
    flood_distance_km: 5
    base_topic: merlinccu

  # Controls pages (step 7). Needs the MQTT integration.
  controls:
    units:
      # Each unit's mqtt_unit from http://<unit>/api/firmware, quoted.
      "2ccf67a1b2c3":
        - light.hall
        - entity: scene.evening
          # Optional. Left out, the key shows HA's name for the entity.
          name: Evening
